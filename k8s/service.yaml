apiVersion: v1
kind: Service
metadata:
  name: biocad-test-service
spec:
  type: NodePort
  selector:
    app: biocad-test          # ← должен совпадать с labels в Deployment
  ports:
  - protocol: TCP
    port: 80                  # порт сервиса внутри кластера
    targetPort: 32777         # порт на поде (containerPort)
    nodePort: 30080           # порт на ноде (30000–32767)